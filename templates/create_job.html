<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create GPU Job - TurboMesh</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input[type="file"] {
            padding: 10px;
        }

        .workload-info {
            margin-top: 15px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 7px;
            color: #4b5563;
            line-height: 1.5;
        }

        .upload-section {
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create GPU Job</h1>

        <p class="description">
            Submit a GPU workload to a host you have access to.
        </p>

        <form method="post"
              action="/create-job"
              enctype="multipart/form-data">

            <!-- GPU HOST -->

            <label for="host_id">
                Select GPU Host
            </label>

            <select id="host_id" name="host_id" required>

                {% for host in hosts %}

                <option value="{{ host['id'] }}">
                    {{ host['name'] }} - {{ host['gpu_name'] }}
                </option>

                {% endfor %}

            </select>


            <!-- WORKLOAD -->

            <label for="job_type">
                Select Image Processing Workload
            </label>

            <select id="job_type"
                    name="job_type"
                    required>

                <option value="OBJECT_DETECTION">
                    Object Detection + Image Analytics
                </option>

                <option value="IMAGE_SIMILARITY">
                    Image Similarity / Duplicate Detection
                </option>

            </select>


            <!-- WORKLOAD DESCRIPTION -->

            <div id="workloadInfo"
                 class="workload-info">

                Detect objects using YOLO, count objects,
                estimate vehicle colors, blur license plates,
                and generate image analytics.

            </div>


            <!-- OBJECT DETECTION -->

            <div id="objectDetectionUpload"
                 class="upload-section">

                <label for="image">
                    Upload Image
                </label>

                <input type="file"
                       id="image"
                       name="image"
                       accept="image/*"
                       required>

                <p class="description">
                    Upload exactly one image.
                </p>

            </div>


            <!-- IMAGE SIMILARITY -->

            <div id="similarityUpload"
                 class="upload-section hidden">

                <label for="image1">
                    Upload Image 1
                </label>

                <input type="file"
                       id="image1"
                       name="image1"
                       accept="image/*">

                <label for="image2">
                    Upload Image 2
                </label>

                <input type="file"
                       id="image2"
                       name="image2"
                       accept="image/*">

                <p class="description">
                    Upload exactly two images to compare
                    their similarity.
                </p>

            </div>


            <!-- SUBMIT -->

            <button type="submit">
                Submit GPU Job
            </button>

        </form>

    </div>


    <script>

        const jobType = document.getElementById("job_type");

        const objectDetectionUpload =
            document.getElementById("objectDetectionUpload");

        const similarityUpload =
            document.getElementById("similarityUpload");

        const workloadInfo =
            document.getElementById("workloadInfo");

        const image =
            document.getElementById("image");

        const image1 =
            document.getElementById("image1");

        const image2 =
            document.getElementById("image2");


        function updateWorkloadUI() {

            if (jobType.value === "OBJECT_DETECTION") {

                objectDetectionUpload.classList.remove("hidden");

                similarityUpload.classList.add("hidden");

                image.required = true;

                image1.required = false;
                image2.required = false;

                workloadInfo.textContent =
                    "Detect objects using YOLO, count objects, " +
                    "estimate vehicle colors, blur license plates, " +
                    "and generate image analytics.";

            }


            else if (jobType.value === "IMAGE_SIMILARITY") {

                objectDetectionUpload.classList.add("hidden");

                similarityUpload.classList.remove("hidden");

                image.required = false;

                image1.required = true;
                image2.required = true;

                workloadInfo.textContent =
                    "Compare two images using perceptual hashing, " +
                    "histogram comparison, SSIM, and CLIP " +
                    "embeddings to detect duplicates or near-duplicates.";

            }

        }


        jobType.addEventListener(
            "change",
            updateWorkloadUI
        );


        updateWorkloadUI();

    </script>

</body>

</html>
